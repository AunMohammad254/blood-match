name: BloodMatch CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        run: bun test

      - name: Run Build
        run: bun run build
        env:
          JWT_SECRET: "ci-test-jwt-secret-key-32-chars-min"
          MONGODB_URI: "mongodb://localhost:27017/bloodmatch_ci"
